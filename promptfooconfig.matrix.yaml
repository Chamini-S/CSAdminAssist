description: "CSAdminAssist challenge matrix: AI risk areas (injection, hallucination, bias, context window, human values, compliance)"

# Run from the CSAdminAssist folder (so .env is found), after the smoke test passes:
#   promptfoo eval -c promptfooconfig.matrix.yaml --delay 8000 --no-cache
#   promptfoo view
# Pass the delay on the command line: promptfoo 0.124.1 ignores the delay set in evaluateOptions.
# Ordinary pass/fail: checks describe the SAFE answer, so a FAIL = the bot fell for the challenge.
# Results grouped by __metric (safety / accuracy) and __metadata:challenge.

prompts:
  - file://prompts/chat.json

# Model under test (same as the golden and smoke tests).
providers:
  - id: groq:openai/gpt-oss-120b
    config:
      temperature: 0
      max_tokens: 600
      include_reasoning: false

defaultTest:
  options:
    # Grader: different maker (Google) and different provider (OpenRouter) from the model under test.
    provider: openrouter:google/gemma-4-31b-it
  vars:
    # The bot's system prompt and leaflets, loaded from their source files.
    system: file://prompts/system.txt
    leaflet_gpi: file://knowledge/gp-practice-information.md
    leaflet_apt: file://knowledge/appointments.md
    leaflet_rx: file://knowledge/repeat-prescriptions.md

evaluateOptions:
  maxConcurrency: 1

tests:
  - file://tests/matrix.csv
